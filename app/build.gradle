plugins { id 'com.android.application' }

android {
    namespace 'com.nexo.studio3d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexo.studio3d'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
