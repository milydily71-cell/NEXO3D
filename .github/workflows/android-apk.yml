name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platforms;android-35,build-tools;35.0.0,ndk;27.2.12479018,cmake;3.22.1'
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify toolchain
        run: |
          java -version
          sdkmanager --list_installed
          cmake --version
      - name: Assemble debug APK including native C++ library
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and native libraries
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/[^/]+/libnexo_native.so'
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Studio-3D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
